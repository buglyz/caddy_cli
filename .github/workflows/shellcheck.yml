name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          set -euo pipefail
          scripts=(
            caddy-lib.sh
            caddy.sh
            caddy-cloudflare.sh
            install.sh
            install-cloudflare.sh
            caddy-cloudflare
            emby-gateway
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Check checksums
        run: |
          sha256sum -c checksums.txt

      - name: Generated Caddyfile smoke tests
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          bash -c 'source ./caddy-lib.sh; build_gateway_site_block gate.example.com https "$(gateway_allow_regex "emby.example.com:443,10.0.0.5:8096")" "emby.example.com:443,10.0.0.5:8096"' > "$tmp"
          ./caddy validate --config "$tmp" --adapter caddyfile

          bash -c 'source ./caddy-lib.sh; build_static_site_block static.example.com "/var/www/site with spaces" on' > "$tmp"
          ./caddy validate --config "$tmp" --adapter caddyfile

      - name: ShellCheck
        run: |
          shellcheck \
            caddy-lib.sh \
            caddy.sh \
            caddy-cloudflare.sh \
            install.sh \
            install-cloudflare.sh \
            caddy-cloudflare \
            emby-gateway
