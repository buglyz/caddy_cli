name: Release Go CLI

on:
  push:
    branches:
      - refactor/go
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, test, race and vet
        run: make check

  build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          asset="caddyctl-linux-${GOARCH}"
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            version="go-latest-${GITHUB_SHA::7}"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/buglyz/caddy_cli/internal/caddyctl.Version=${version}" \
            -o "$asset" ./cmd/caddyctl
          sha256sum "$asset" > "${asset}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: caddyctl-linux-${{ matrix.goarch }}
          path: |
            caddyctl-linux-${{ matrix.goarch }}
            caddyctl-linux-${{ matrix.goarch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          find dist -name '*.sha256' -type f -print0 \
            | sort -z \
            | xargs -0 cat > dist/caddyctl-checksums.txt
          (
            cd dist
            sha256sum --check caddyctl-checksums.txt
          )
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            tag="go-latest"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${tag}" \
                -f sha="${GITHUB_SHA}" >/dev/null
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --title "Go rolling build" \
                --notes "Automated build from ${GITHUB_SHA} on refactor/go."
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Go rolling build" \
              --notes "Automated build from ${GITHUB_SHA} on refactor/go."
          else
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Fixed release already exists and will not be modified: $tag" >&2
              exit 1
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi
          upload_args=(
            "$tag"
            dist/caddyctl-linux-amd64
            dist/caddyctl-linux-arm64
            dist/caddyctl-checksums.txt
            --repo "$GITHUB_REPOSITORY"
          )
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "${upload_args[@]}"
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected_version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            tag="go-latest"
            expected_version="go-latest-${GITHUB_SHA::7}"
          fi
          mkdir -p verify
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir verify \
            --pattern 'caddyctl-linux-*' \
            --pattern 'caddyctl-checksums.txt'
          (
            cd verify
            sha256sum --check caddyctl-checksums.txt
          )
          chmod 0755 verify/caddyctl-linux-amd64
          test "$(verify/caddyctl-linux-amd64 version)" = "$expected_version"
