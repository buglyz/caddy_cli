name: CI

on:
  push:
    branches: [main, refactor/go]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy shellcheck

      - name: Format, test and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          shellcheck install-go.sh

      - name: Static builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/caddyctl-amd64 ./cmd/caddyctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/caddyctl-arm64 ./cmd/caddyctl

      - name: Caddy integration
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          export CADDYCTL_ROOT="$root"
          export CADDYCTL_SKIP_DNS_CHECK=1
          export CADDYCTL_NO_RELOAD=1
          /tmp/caddyctl-amd64 add app.example.com 3000
          /tmp/caddyctl-amd64 add-static static.example.com "/srv/site with spaces" --spa
          /tmp/caddyctl-amd64 add-emby emby.example.com https://10.0.0.5:8096
          /tmp/caddyctl-amd64 add-gateway gate.example.com --allow emby.example.com:443
          /tmp/caddyctl-amd64 validate
          caddy validate --config "$root/etc/caddy/Caddyfile" --adapter caddyfile

      - name: Installer integration
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/release" "$root/bad-release" "$root/bin"
          install -m 0755 /tmp/caddyctl-amd64 "$root/release/caddyctl-linux-amd64"
          (
            cd "$root/release"
            sha256sum caddyctl-linux-amd64 > caddyctl-checksums.txt
          )
          install -m 0755 /bin/true "$root/bin/caddyctl"
          install -m 0755 /tmp/caddyctl-amd64 "$root/bad-release/caddyctl-linux-amd64"
          printf '%064d  caddyctl-linux-amd64\n' 0 > "$root/bad-release/caddyctl-checksums.txt"
          before="$(sha256sum "$root/bin/caddyctl")"
          if CADDYCTL_GO_BIN_DIR="$root/bin" \
            CADDYCTL_GO_CF_MARKER="$root/etc/caddy/.caddyctl-cloudflare" \
            CADDYCTL_GO_CONFIG_DIR="$root/etc/caddy" \
            CADDYCTL_GO_LOG_DIR="$root/var/log/caddy" \
            CADDYCTL_GO_RELEASE_BASE_URL="file://$root/bad-release" \
              bash install-go.sh; then
            echo "installer accepted an invalid checksum" >&2
            exit 1
          fi
          test "$(sha256sum "$root/bin/caddyctl")" = "$before"
          test ! -e "$root/etc/caddy"
          mkdir -p "$root/etc/caddy"
          printf 'legacy.example.com {\n    reverse_proxy 127.0.0.1:3000\n}\n' \
            > "$root/etc/caddy/Caddyfile"
          CADDYCTL_GO_BIN_DIR="$root/bin" \
          CADDYCTL_GO_CF_MARKER="$root/etc/caddy/.caddyctl-cloudflare" \
          CADDYCTL_GO_CONFIG_DIR="$root/etc/caddy" \
          CADDYCTL_GO_LOG_DIR="$root/var/log/caddy" \
          CADDYCTL_GO_RELEASE_BASE_URL="file://$root/release" \
            bash install-go.sh
          test -x "$root/bin/caddyctl"
          test -x "$root/bin/caddyctl.bak"
          test -L "$root/bin/c"
          test -f "$root/etc/caddy/.caddyctl-pending-import"
          find "$root/etc/caddy/backup" -path '*/pre-install-*/Caddyfile' -type f | grep -q .
          "$root/bin/caddyctl" --help >/dev/null

  fresh-install:
    name: Fresh install (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [debian:12-slim, alpine:3.22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build installer fixture
        run: |
          set -euo pipefail
          mkdir -p /tmp/caddyctl-release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -o /tmp/caddyctl-release/caddyctl-linux-amd64 \
            ./cmd/caddyctl
          (
            cd /tmp/caddyctl-release
            sha256sum caddyctl-linux-amd64 > caddyctl-checksums.txt
          )

      - name: Install Caddy and caddyctl from scratch
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v /tmp/caddyctl-release:/release:ro \
            "$IMAGE" \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update >/dev/null
                apt-get install -y --no-install-recommends ca-certificates curl >/dev/null
              else
                apk add --no-cache bash curl >/dev/null
              fi
              CADDYCTL_GO_RELEASE_BASE_URL=file:///release bash /src/install-go.sh
              caddy version
              caddyctl version
              test -d /etc/caddy/sites.d
              test -d /var/log/caddy
              grep -Fxq "# managed by caddyctl" /etc/caddy/Caddyfile
              CADDYCTL_SKIP_DNS_CHECK=1 CADDYCTL_NO_RELOAD=1 \
                caddyctl add smoke.example.com 8080
              caddyctl validate
            '
